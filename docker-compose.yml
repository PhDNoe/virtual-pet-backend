version: "3.9"

services:
  web:
    build: .
    container_name: django_app
    command: sh /entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

    env_file:
      - .env


  db:
    image: postgres:15
    container_name: postgres_db
    restart: always

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: always
    # CARGA DE VARIABLES DESDE EL ARCHIVO .env
    env_file:
      - .env 
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data: