version: "3.9"

services:
  web:
    build: .
    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    # CARGA DE VARIABLES DESDE EL ARCHIVO .env
    env_file:
      - .env
    environment:
      - DEBUG=1
      # El host y el puerto SÍ se quedan, ya que son parámetros de Docker
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      # Las variables de credenciales (USER, PASSWORD, NAME) se cargan desde .env

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    # CARGA DE VARIABLES DESDE EL ARCHIVO .env
    env_file:
      - .env 
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: always
    # CARGA DE VARIABLES DESDE EL ARCHIVO .env
    env_file:
      - .env 
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data: